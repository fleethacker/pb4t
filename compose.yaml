services:
  planner:
    build: .
    image: pb4t-planner:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_PATH: /data/scheduler.db
      SHIP_TIMEZONE: ${SHIP_TIMEZONE:-America/New_York}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - planner-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  planner-data:
