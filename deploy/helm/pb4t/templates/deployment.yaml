apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pb4t.fullname" . }}
  labels:
    {{- include "pb4t.labels" . | nindent 4 }}
spec:
  # SQLite has one application writer; upgrades must stop the old Pod first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pb4t.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pb4t.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: planner
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: DATABASE_PATH
              value: /data/scheduler.db
            - name: SHIP_TIMEZONE
              value: {{ .Values.config.timezone | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.config.openaiModel | quote }}
            {{- if .Values.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openai.existingSecret | quote }}
                  key: {{ .Values.openai.key | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/context
              port: http
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/context
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "pb4t.fullname" .)) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
